limit_req_zone $binary_remote_addr zone=nod_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nod_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name nod.haggle.site;
    location ^~ /.well-known/acme-challenge/ { root /var/www/nod-acme; }
    location / { return 301 https://nod.haggle.site$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nod.haggle.site;
    ssl_certificate /etc/letsencrypt/live/nod.haggle.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nod.haggle.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 256k;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location ~ ^/api/v1/auth/(register|resend|verify|login)/$ {
        limit_req zone=nod_auth burst=10 nodelay;
        include /etc/nginx/snippets/nod-api-proxy.conf;
    }
    location /api/ {
        limit_req zone=nod_api burst=30 nodelay;
        include /etc/nginx/snippets/nod-api-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
